name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # the tool reads files Word wrote, so check it runs where Word lives
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The text checks need font files. Windows ships the real Calibri and
      # Cambria; Linux and macOS runners ship neither, and without the
      # metric-compatible clones the tool would silently fall back to some
      # unrelated face and measure the wrong widths. Installing them explicitly
      # is what makes the layout assertions below mean the same thing on all
      # three platforms.
      - name: Install metric-compatible fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-crosextra-carlito fonts-crosextra-caladea \
                                      fonts-liberation fontconfig
          echo "$(fc-list | wc -l) faces known to fontconfig"

      - name: Install metric-compatible fonts (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask font-carlito font-caladea font-liberation
          ls ~/Library/Fonts | head -20

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      # Not decoration. A runner that cannot measure text turns every layout
      # error into a warning and exits 0, which is exactly the silent
      # degradation this tool exists to catch - so it is a hard failure here.
      #
      # The second assertion is the sharper one. Some fallback face is almost
      # always available, so `measurement_available` alone would pass on a
      # runner where Calibri quietly resolved to Helvetica and every width was
      # wrong. Requiring an exact or metric-compatible match for the two faces
      # the fixtures use turns "the fonts did not install" into that sentence,
      # instead of an unexplained count mismatch three steps later.
      - name: Text measurement works on this runner
        run: |
          python -c "
          import sys
          from ooxml_integrity.fonts import measurement_available, resolve_face
          ok, detail = measurement_available()
          print('measurement available:', ok, '|', detail)
          bad = []
          for fam in ['Calibri', 'Arial', 'Cambria', 'Times New Roman', 'Segoe UI']:
              f = resolve_face(fam)
              print(f'  {fam:16} -> {f.family:24} [{f.match}]')
              if fam in ('Calibri', 'Cambria') and f.match not in ('exact', 'metric'):
                  bad.append(f'{fam} resolved to {f.family} [{f.match}]')
          if not ok:
              print('::error::no usable fonts on this runner')
              sys.exit(1)
          if bad:
              print('::error::the fixtures need metric-compatible faces: ' + '; '.join(bad))
              sys.exit(1)
          "

      - name: Test
        run: python -m pytest -q

      - name: Evaluate committed DOCX producer evidence (no Office required)
        run: python research/build_docx_evidence.py evaluate

      - name: The reference corpus rebuilds byte-clean
        working-directory: research
        env:
          DI_BASE: ../corpus/base.docx
        run: |
          python build_corpus.py
          cd ..
          ooxml-integrity check corpus/base.docx --fail-on info

      # The deck is *designed* to contain defects, so the assertion is on which
      # defects come back, not on the exit code: a runner with no fonts reports
      # the same problems as warnings and exits 0, and an exit-code check would
      # call that a pass. assert_deck.py compares the full multiset of codes.
      - name: The reference deck rebuilds and still reports the same defects
        working-directory: research
        env:
          DI_PPTX: ../corpus/deck.pptx
        run: |
          python build_pptx_corpus.py
          cd ..
          python research/assert_deck.py corpus/deck.pptx

      # The deployability layer gets its own gate. It is the part other people's
      # repositories depend on, and a suppression bug is silent by nature: the
      # run goes green and the finding is simply gone.
      - name: Suppression, baseline and SARIF survive a round trip
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp runs/t4_fast_fee/agreement.docx "$work/"

          # 1. fails by default
          if ooxml-integrity check "$work/agreement.docx" --against corpus/base.docx \
               --no-config; then
            echo "::error::the fast agent run should fail the default threshold"
            exit 1
          fi

          # 2. a baseline written from it makes the same run pass
          ooxml-integrity check "$work/agreement.docx" --against corpus/base.docx \
            --write-baseline "$work/base.json"
          ooxml-integrity check "$work/agreement.docx" --against corpus/base.docx \
            --baseline "$work/base.json"

          # 3. a finding in a file the baseline never saw still fails. The same
          #    content under a different path is a different fingerprint, which
          #    is the property that keeps a baseline from becoming a blanket
          #    "ignore this rule everywhere".
          cp "$work/agreement.docx" "$work/another.docx"
          if ooxml-integrity check "$work/another.docx" --against corpus/base.docx \
               --baseline "$work/base.json"; then
            echo "::error::a finding in an unlisted file was hidden by the baseline"
            exit 1
          fi

          # 4. SARIF is written and parses, with the rule in it
          ooxml-integrity check "$work/agreement.docx" --against corpus/base.docx \
            --sarif "$work/out.sarif" --no-config || true
          python - "$work/out.sarif" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["version"] == "2.1.0", d.get("version")
          run = d["runs"][0]
          assert run["tool"]["driver"]["name"] == "ooxml-integrity"
          codes = {r["ruleId"] for r in run["results"]}
          assert "CMT005" in codes, sorted(codes)
          print(f"SARIF ok: {len(run['results'])} result(s), rules {sorted(codes)}")
          PYEOF

      # Only the two fixtures were rebuilt, so only they are checked. Diffing
      # the whole tree also catches line-ending noise from checkout on Windows,
      # which has nothing to do with reproducibility.
      - name: The rebuilt fixtures are byte-identical to the committed ones
        shell: bash
        run: |
          if ! git diff --quiet -- corpus/base.docx corpus/deck.pptx; then
            echo "::error::rebuilding a fixture changed it - the build is not reproducible"
            git diff --stat -- corpus/base.docx corpus/deck.pptx
            exit 1
          fi
          echo "both fixtures rebuilt byte-identical"

  self-check:
    name: the action checks its own fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The six careful agent runs must pass with the default threshold.
      - name: Careful agent runs are clean
        uses: ./
        with:
          files: >-
            runs/t1_bare/agreement.docx
            runs/t1_pres/agreement.docx
            runs/t2_bare/agreement.docx
            runs/t2_pres/agreement.docx
            runs/t5_rewrite_bare/agreement.docx
            runs/t5_rewrite_pres/agreement.docx
          against: corpus/base.docx
          json-report: careful.json

      # The two fast runs must fail. `continue-on-error` plus an explicit
      # assertion, so a silent pass here is caught rather than celebrated.
      - name: Fast agent runs are caught
        id: fast
        continue-on-error: true
        uses: ./
        with:
          files: >-
            runs/t4_fast_fee/agreement.docx
            runs/t4_fast_table/agreement.docx
          against: corpus/base.docx

      - name: Assert the fast runs were caught
        run: |
          if [ "${{ steps.fast.outputs.exit-code }}" = "0" ]; then
            echo "::error::the fast agent runs should have failed the check"
            exit 1
          fi
          echo "caught ${{ steps.fast.outputs.errors }} error(s), as expected"

      - uses: actions/upload-artifact@v4
        with:
          name: ooxml-integrity-report
          path: careful.json
          if-no-files-found: warn
