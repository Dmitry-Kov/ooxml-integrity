name: Browser runtime

on:
  pull_request:
    paths:
      - "demo/**"
      - "tests/browser/**"
      - "research/prepare_browser_preview.py"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/browser.yml"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Chromium / ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [release, wheel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build a wheel and prepare an isolated preview
        if: matrix.package == 'wheel'
        run: |
          python -m pip install build
          python -m build --wheel
          python research/prepare_browser_preview.py --wheel dist/*.whl
      - name: Real Pyodide browser checks
        working-directory: tests/browser
        env:
          OOXML_DEMO_DIR: ${{ github.workspace }}/${{ matrix.package == 'wheel' && 'tmp/browser-preview' || 'demo' }}
        run: npm test
      - name: Upload browser receipts and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.package }}-${{ github.sha }}
          path: tmp/browser-results/${{ matrix.package }}/
          if-no-files-found: warn
