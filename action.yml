name: "ooxml-integrity"
description: >-
  Check .docx files for structural defects and content lost relative to a source,
  and .pptx files for text overflow, overlap, and off-canvas content.
author: "Dmitrii Kovalev"

branding:
  icon: "file-text"
  color: "green"

inputs:
  files:
    description: >-
      .docx or .pptx paths/globs to check, whitespace or newline separated.
      Example: "docs/**/*.docx" or "out/report.docx slides/deck.pptx".
    required: true
  against:
    description: >-
      Optional source .docx. When set, the run also reports what each .docx lost
      relative to it - comment anchors, footnotes, tracked changes. PowerPoint
      source comparison is not implemented and fails the check rather than being
      silently skipped; an unreadable source also fails the check.
    required: false
    default: ""
  fail-on:
    description: "Minimum severity that fails the step: error (default), warn, info."
    required: false
    default: "error"
  version:
    description: >-
      Explicit PyPI version override, e.g. "0.3.1". Empty installs the code from
      the selected Action ref, so a pinned ref also pins the checker source.
    required: false
    default: ""
  source:
    description: >-
      Explicit pip source override: a local path (".") or anything pip accepts,
      e.g. "git+https://github.com/Dmitry-Kov/ooxml-integrity@main". Takes
      precedence over `version`; useful for trying an unreleased fix.
    required: false
    default: ""
  python-version:
    description: "Python used to run the checker."
    required: false
    default: "3.12"
  json-report:
    description: >-
      Path to write a JSON report to, e.g. "ooxml-integrity.json". Empty writes
      no file. Useful as a build artifact.
    required: false
    default: ""
  config:
    description: >-
      Config file. Empty uses the default search: .ooxml-integrity.toml or a
      [tool.ooxml-integrity] section in pyproject.toml, upwards from the working
      directory. Set to "none" to ignore any config that would be found.
    required: false
    default: ""
  baseline:
    description: >-
      Fail only on findings absent from this baseline file. This is how an
      existing repository adopts the check without fixing everything first:
      generate it once with `ooxml-integrity check ... --write-baseline`, commit
      it, and the step then gates new findings only.
    required: false
    default: ""
  sarif:
    description: >-
      Path to write a SARIF 2.1.0 report to, e.g. "ooxml-integrity.sarif". Upload
      it with github/codeql-action/upload-sarif to get findings as annotations
      in the pull request instead of lines in a log.
    required: false
    default: ""

outputs:
  sarif:
    description: "Path of the SARIF report, when `sarif` was set."
    value: ${{ inputs.sarif }}
  exit-code:
    description: "0 clean, 1 findings at or above fail-on, 2 usage error."
    value: ${{ steps.run.outputs.exit-code }}
  errors:
    description: "Number of error-severity findings across all files."
    value: ${{ steps.run.outputs.errors }}
  warnings:
    description: "Number of warning-severity findings across all files."
    value: ${{ steps.run.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ooxml-integrity
      shell: bash
      env:
        OOXML_SOURCE: ${{ inputs.source }}
        OOXML_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$OOXML_SOURCE" ]; then
          python -m pip install --quiet "$OOXML_SOURCE"
        elif [ -n "$OOXML_VERSION" ]; then
          python -m pip install --quiet "ooxml-integrity==$OOXML_VERSION"
        else
          python -m pip install --quiet "$GITHUB_ACTION_PATH"
        fi
        python -m ooxml_integrity --version

    - name: Check documents
      id: run
      shell: bash
      env:
        OOXML_FILES: ${{ inputs.files }}
        OOXML_AGAINST: ${{ inputs.against }}
        OOXML_FAIL_ON: ${{ inputs.fail-on }}
        OOXML_JSON_REPORT: ${{ inputs.json-report }}
        OOXML_CONFIG: ${{ inputs.config }}
        OOXML_BASELINE: ${{ inputs.baseline }}
        OOXML_SARIF: ${{ inputs.sarif }}
      run: |
        # macOS runners still use Bash 3.2, where expanding an empty array under
        # nounset fails. The Action intentionally allows an empty SARIF array.
        set -eo pipefail
        args=()
        # Keep globs literal for the cross-platform expansion in the CLI. Input
        # values are split only on whitespace, as documented above.
        set -f
        # shellcheck disable=SC2086
        for f in $OOXML_FILES; do args+=("$f"); done
        set +f
        if [ -n "$OOXML_AGAINST" ]; then
          args+=(--against "$OOXML_AGAINST")
        fi
        args+=(--fail-on "$OOXML_FAIL_ON")
        if [ "$OOXML_CONFIG" = "none" ]; then
          args+=(--no-config)
        elif [ -n "$OOXML_CONFIG" ]; then
          args+=(--config "$OOXML_CONFIG")
        fi
        if [ -n "$OOXML_BASELINE" ]; then
          args+=(--baseline "$OOXML_BASELINE")
        fi

        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        human_report="$work/human.txt"
        machine_report="$work/report.json"

        # Human-readable output into the log and the job summary.
        set +e
        python -m ooxml_integrity check "${args[@]}" | tee "$human_report"
        code=${PIPESTATUS[0]}
        set -e

        # A second pass for machine-readable counts, and the SARIF report in the
        # same pass. Cheap: no rendering, no model calls, no network.
        sarif_args=()
        if [ -n "$OOXML_SARIF" ]; then
          sarif_args+=(--sarif "$OOXML_SARIF")
        fi
        python -m ooxml_integrity check "${args[@]}" "${sarif_args[@]}" --json \
          > "$machine_report" || true
        errors=0
        warnings=0
        counts_valid=false
        if counts=$(python -c '
        import json, sys
        with open(sys.argv[1]) as report:
            data = json.load(report)
        print(
            sum(file["summary"]["error"] for file in data["files"]),
            sum(file["summary"]["warn"] for file in data["files"]),
        )
        ' "$machine_report" 2>/dev/null); then
          read -r errors warnings <<< "$counts"
          counts_valid=true
        fi

        {
          echo "### ooxml-integrity"
          echo
          if [ "$code" -eq 0 ]; then
            printf 'No findings at or above `%s`.\n' "$OOXML_FAIL_ON"
          elif [ "$counts_valid" = true ]; then
            echo "**$errors error(s), $warnings warning(s)**"
          else
            echo "The checker exited with code $code before producing a JSON report."
          fi
          echo
          echo '```'
          cat "$human_report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$OOXML_JSON_REPORT" ]; then
          cp "$machine_report" "$OOXML_JSON_REPORT"
        fi

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "errors=$errors" >> "$GITHUB_OUTPUT"
        echo "warnings=$warnings" >> "$GITHUB_OUTPUT"
        exit "$code"
